name: Daily crawl and publish map

# GitHub-native daily pipeline.
# After data/control/{tracked_movies,cinema_master}.json are materialized, the crawl no longer
# requires Render/Django/Postgres. Before that one-time migration finishes, the scripts retain
# the legacy backend fallback so production cannot be cut over half-way.
#
# Runtime: control data → ephemeral SQLite → cinema code refresh → showtime crawlers → GeoJSON
#          → commit public data / last-known-good codes → deploy GitHub Pages.
#
# MUSE_API_BASE_URL / MUSE_API_TOKEN are migration/legacy compatibility only. Once both control
# files exist they are not required by the scheduled crawl and may later be removed safely.

on:
  schedule:
    # 每天台灣時間 07:00（UTC+8）＝ 前一天 UTC 23:00。
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "場次日期 YYYY-MM-DD（留空＝台灣時區的今天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      # Compatibility only until migration is verified/materialized.
      MUSE_API_BASE_URL: ${{ secrets.MUSE_API_BASE_URL }}
      MUSE_API_TOKEN: ${{ secrets.MUSE_API_TOKEN }}
      MUSE_WORKER_NAME: github-actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium and system deps
        run: python -m playwright install --with-deps chromium

      - name: Install Xvfb (headful browser for 威秀 VIESHOW)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build cinema master DB
        # GitHub canonical master takes precedence. If migration has not materialized it yet,
        # pull_cinema_master.py uses the legacy backend. A corrupt/half-present local master
        # fails closed instead of silently switching sources.
        run: python scripts/pull_cinema_master.py --require-codes

      - name: Overlay version-controlled cinema data and verify Shin Kong
        # Preserve existing verified overlays. They update only existing natural-key locations.
        run: |
          python scripts/import_cinema_sources.py data/input/cinema_codes.csv --overlay-existing --chain "新光影城" --require-existing
          python scripts/verify_cinema_codes.py --csv data/input/cinema_codes.csv --chain "新光影城"
          python scripts/import_cinema_sources.py data/input/manual_location_urls.csv --overlay-existing --chain "秀泰影城" --require-existing

      - name: Refresh scraped-chain location codes (新光/in89/國賓/秀泰/美麗新)
        # Runtime refresh writes into ephemeral SQLite. The next step persists non-empty refreshed
        # codes into GitHub cinema_master.json (or legacy backend before migration), retaining
        # last-known-good values when a source is temporarily unavailable.
        run: |
          if curl -L -o /dev/null -sS --connect-timeout 15 --max-time 90 \
            -w 'SKCINEMAS curl http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n' \
            'https://www.skcinemas.com/films?c=1001'; then
            SKCINEMAS_OFFICIAL_REACHABLE=true
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=true' >> "$GITHUB_ENV"
          else
            SKCINEMAS_OFFICIAL_REACHABLE=false
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=false' >> "$GITHUB_ENV"
            echo '::warning::SKCINEMAS official site is unreachable; the daily crawl will use the @movies fallback.'
          fi
          if [ "$SKCINEMAS_OFFICIAL_REACHABLE" = "false" ]; then
            echo 'SKCINEMAS official site unavailable; retaining verified last-known-good codes.'
          elif ! (xvfb-run -a --server-args="-screen 0 1366x900x24" \
              python scripts/fetch_skcinemas_locations.py --headed || \
              xvfb-run -a --server-args="-screen 0 1366x900x24" \
              python scripts/fetch_skcinemas_locations.py --headed); then
            echo "::warning::新光即時據點刷新失敗；保留已驗證代碼，並由場次來源回報最終狀態。"
          fi
          python scripts/fetch_in89_locations.py || true
          python scripts/fetch_ambassador_locations.py || true
          python scripts/fetch_showtimes_locations.py || true
          python scripts/fetch_misc_locations.py || true

      - name: Persist refreshed cinema codes
        # In GitHub mode this is a required integrity write and must not be masked by
        # continue-on-error. In legacy mode backend POST errors remain internally non-fatal.
        run: python scripts/push_cinema_codes.py

      - name: Run daily crawl (headful via Xvfb)
        env:
          SKCINEMAS_HEADLESS: "false"
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/daily_update.py --no-git $DATE_ARG

      - name: Commit and push updated map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/locations.geojson 電影清單.txt
          if [ -f data/control/cinema_master.json ]; then
            git add data/control/cinema_master.json
          fi
          if git diff --cached --quiet; then
            echo "地圖資料與 control state 無變動，無須發佈。"
          else
            git commit -m "Update map data (scheduled crawl)"
            git push
          fi

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (含 crawl 剛推上的最新地圖資料)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
