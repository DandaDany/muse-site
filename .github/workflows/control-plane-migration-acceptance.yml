name: Control plane migration acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: control-plane-migration-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/remove-render-control-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler and backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      - name: Run migration and regression unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest tests.test_control_data_migration -v

      - name: Validate Python and Django wiring
        run: |
          python -m compileall -q scripts tests backend
          (cd backend && python manage.py check)

      - name: Diff hygiene
        run: git diff --check
