name: Title matching regression and map refresh

on:
  push:
    branches:
      - agent/unicode-movie-title-matching
    paths:
      - .github/workflows/agent-title-match-refresh.yml

permissions:
  contents: write

concurrency:
  group: agent-title-match-refresh
  cancel-in-progress: false

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      MUSE_API_BASE_URL: ${{ secrets.MUSE_API_BASE_URL }}
      MUSE_API_TOKEN: ${{ secrets.MUSE_API_TOKEN }}
      MUSE_WORKER_NAME: github-actions-title-match-regression

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Permanent title matching regression
        run: |
          python -m unittest tests.test_movie_title_matching -v
          python -m compileall -q scripts tests

      - name: Build cinema master DB from backend
        run: python scripts/pull_cinema_master.py --require-codes

      - name: Overlay version-controlled cinema data
        run: |
          python scripts/import_cinema_sources.py data/input/cinema_codes.csv --overlay-existing --chain "新光影城" --require-existing
          python scripts/verify_cinema_codes.py --csv data/input/cinema_codes.csv --chain "新光影城"
          python scripts/import_cinema_sources.py data/input/manual_location_urls.csv --overlay-existing --chain "秀泰影城" --require-existing

      - name: Refresh dynamic cinema codes
        run: |
          if curl -L -o /dev/null -sS --connect-timeout 15 --max-time 90 \
            -w 'SKCINEMAS curl http=%{http_code} total=%{time_total}\n' \
            'https://www.skcinemas.com/films?c=1001'; then
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=true' >> "$GITHUB_ENV"
          else
            echo 'SKCINEMAS_OFFICIAL_REACHABLE=false' >> "$GITHUB_ENV"
          fi
          if [ "${SKCINEMAS_OFFICIAL_REACHABLE:-true}" != "false" ]; then
            xvfb-run -a --server-args="-screen 0 1366x900x24" python scripts/fetch_skcinemas_locations.py --headed || true
          fi
          python scripts/fetch_in89_locations.py || true
          python scripts/fetch_ambassador_locations.py || true
          python scripts/fetch_showtimes_locations.py || true
          python scripts/fetch_misc_locations.py || true

      - name: Refresh 2026-08-21 map using production path
        env:
          SKCINEMAS_HEADLESS: "false"
        run: |
          xvfb-run -a --server-args="-screen 0 1366x900x24" \
            python scripts/daily_update.py --no-git --date 2026-08-21

      - name: Assert Madoka VIESHOW data exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('web/data/locations.geojson').read_text(encoding='utf-8'))
          title = '魔法少女小圓劇場版［新篇］叛逆的物語'
          features = p.get('movie_features_by_date', {}).get(title, {}).get('2026-08-21', [])
          vieshow = [f for f in features if '威秀' in f.get('properties', {}).get('chain_name', '') or 'MUVIE' in f.get('properties', {}).get('chain_name', '')]
          showtimes = sum(len(f.get('properties', {}).get('showtimes', [])) for f in vieshow)
          print(f'VIESHOW features={len(vieshow)} showtimes={showtimes}')
          assert vieshow, 'Madoka has no VIESHOW feature after Unicode matching fix'
          assert showtimes > 0, 'Madoka VIESHOW features contain no showtimes'
          PY

      - name: Commit refreshed map to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/locations.geojson 電影清單.txt
          if git diff --cached --quiet; then
            echo "Map data unchanged."
          else
            git commit -m "Refresh map after Unicode title matching fix"
            git push
          fi
