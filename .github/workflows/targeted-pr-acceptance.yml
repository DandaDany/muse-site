name: Ambassador, Popup, and Halar acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: targeted-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.head_ref == 'agent/fix-ambassador-popup-halar'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Prepare artifacts
        run: mkdir -p artifacts/live-pages

      - name: Complete automated validation
        run: |
          set -o pipefail
          {
            python -m unittest discover -s tests -v
            python -m unittest tests.test_ambassador_halar_regressions -v
            python -m unittest tests.test_multiday_export tests.test_daily_update_multiday -v
            node tests/frontend_date_state_test.js
            node tests/frontend_time_filter_test.js
            python -m compileall -q scripts tests
            node --check web/app.js
            node --check web/date-state.js
            git diff --check
          } 2>&1 | tee artifacts/automated-tests.log

      - name: Start fixture server
        run: |
          cd web
          python -m http.server 8765 --bind 127.0.0.1 > ../artifacts/http-server.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Existing browser acceptance
        run: python tests/browser_acceptance.py --report artifacts/browser-report.json

      - name: Targeted desktop and mobile acceptance
        run: python tests/browser_targeted_acceptance.py --report artifacts/targeted-browser-report.json

      - name: Ambassador live multi-language comparison
        run: |
          python scripts/live_ambassador_validation.py             --artifact-dir artifacts/live-pages             --log artifacts/ambassador-live-validation.json             2>&1 | tee artifacts/ambassador-live-validation.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-acceptance-${{ github.run_id }}
          path: |
            artifacts/*.png
            artifacts/*.json
            artifacts/*.log
            artifacts/live-pages/**
          if-no-files-found: error
          retention-days: 14
